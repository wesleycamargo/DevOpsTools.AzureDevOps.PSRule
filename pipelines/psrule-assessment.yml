name: PSRule Azure DevOps Assessment

trigger: none
pr: none

schedules:
  - cron: "0 2 * * 0"
    displayName: Weekly PSRule assessment
    branches:
      include:
        - main
    always: true

variables:
  - group: ai-credentials
  - name: ADO_ORGANIZATION
    value: "ai-experiments"
  - name: ADO_TENANT_ID
    value: $[ variables['Directory (tenant) ID'] ]
  - name: ADO_CLIENT_ID
    value: $[ variables['Application (client) ID'] ]
  - name: ADO_CLIENT_SECRET
    value: $[ variables['secret'] ]
  - name: PSRULE_VERSION
    value: "2.9.0"

pool:
  name: 'Azure Pipelines'
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Install PSRule
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $psRule = Get-Module -ListAvailable -Name PSRule |
            Where-Object { $_.Version -eq [version]$env:PSRULE_VERSION } |
            Select-Object -First 1

        if ($null -eq $psRule) {
            Install-Module -Name PSRule `
                -RequiredVersion $env:PSRULE_VERSION `
                -Scope CurrentUser `
                -Force `
                -SkipPublisherCheck
        }
    env:
      PSRULE_VERSION: $(PSRULE_VERSION)

  - task: PowerShell@2
    displayName: Export and assess Azure DevOps organization
    continueOnError: true
    inputs:
      targetType: inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $exportPath = Join-Path $env:AGENT_TEMPDIRECTORY ('psrule-export-' + [guid]::NewGuid().ToString())
        $reportPath = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'psrule-results.sarif'
        $completenessPath = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'collection-status.json'
        $assessmentPath = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'assessment-results.json'

        New-Item -Path $exportPath -ItemType Directory -Force | Out-Null
        New-Item -Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY -ItemType Directory -Force | Out-Null
        $moduleManifest = Join-Path $env:BUILD_SOURCESDIRECTORY 'src/DevOpsTools.AzureDevOps.PSRule/DevOpsTools.AzureDevOps.PSRule.psd1'
        Import-Module $moduleManifest -Force

        $tokenBody = @{
            grant_type = 'client_credentials'
            client_id = $env:ADO_CLIENT_ID
            client_secret = $env:ADO_CLIENT_SECRET
            scope = '499b84ac-1321-427f-aa17-267ca6975798/.default'
        }
        $accessToken = (Invoke-RestMethod `
            -Uri "https://login.microsoftonline.com/$($env:ADO_TENANT_ID)/oauth2/v2.0/token" `
            -Method Post `
            -Body $tokenBody `
            -ContentType 'application/x-www-form-urlencoded').access_token

        $connectionData = Invoke-RestMethod `
            -Uri "https://dev.azure.com/$($env:ADO_ORGANIZATION)/_apis/connectionData" `
            -Headers @{ Authorization = "Bearer $accessToken" }
        if (-not $connectionData.instanceId) {
            throw 'Azure DevOps did not return an organization identity.'
        }
        $organizationId = [guid]$connectionData.instanceId

        $connectParams = @{
            Organization = $env:ADO_ORGANIZATION
            OrganizationId = $organizationId
            AccessToken = $accessToken
        }
        Connect-AzDevOps @connectParams
        Export-AzDevOpsOrganizationRuleData `
            -Organization $env:ADO_ORGANIZATION `
            -OrganizationId $organizationId `
            -OutputPath $exportPath `
            -CompletenessReportPath $completenessPath `
            -Strict

        $inputFiles = @(Get-ChildItem -LiteralPath $exportPath -File -Recurse -Filter '*.json' | Select-Object -ExpandProperty FullName)
        if ($inputFiles.Count -eq 0) { throw 'The organization export produced no JSON input files.' }
        $results = $null
        $assessmentErrors = @()
        $null = Assert-PSRule `
            -InputPath $inputFiles `
            -Module DevOpsTools.AzureDevOps.PSRule `
            -Baseline Baseline.Default `
            -As Detail `
            -OutputPath $reportPath `
            -OutputFormat Sarif `
            -Outcome All `
            -ResultVariable results `
            -ErrorAction SilentlyContinue `
            -ErrorVariable assessmentErrors

        $results = @($results | Where-Object { $null -ne $_ })
        if ($results.Count -eq 0) { throw 'The assessment evaluated zero rule results.' }

        # Assert-PSRule omits precondition outcomes from ResultVariable in PSRule 2.9.
        # Re-evaluate the same immutable export for Unknown/NotApplicable projection.
        $assessmentResults = @(Invoke-PSRule `
            -InputPath $inputFiles `
            -Module DevOpsTools.AzureDevOps.PSRule `
            -Baseline Baseline.Default `
            -Outcome All `
            -ErrorAction Stop)
        $assessment = Export-AzDevOpsAssessmentRun -Result $assessmentResults -ExportPath $exportPath `
            -OutputPath $assessmentPath -Organization $env:ADO_ORGANIZATION `
            -SourceRevision $env:BUILD_SOURCEVERSION -Baseline Baseline.Default
        $failedCount = @($results | Where-Object { $_.Outcome -eq 'Fail' }).Count

        Write-Host "PSRule assessment completed with $failedCount failed rule result(s)."
        Write-Host "##vso[task.setvariable variable=PSRuleFailedCount]$failedCount"
        if (@($assessmentErrors).Count -gt 0) {
            throw 'PSRule reported failures or errors. Raw SARIF and versioned assessment reports have been retained.'
        }
    env:
      ADO_ORGANIZATION: $(ADO_ORGANIZATION)
      ADO_TENANT_ID: $(ADO_TENANT_ID)
      ADO_CLIENT_ID: $(ADO_CLIENT_ID)
      ADO_CLIENT_SECRET: $(ADO_CLIENT_SECRET)

  - task: PublishBuildArtifacts@1
    displayName: Publish PSRule assessment reports
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: psrule-results
      publishLocation: Container
