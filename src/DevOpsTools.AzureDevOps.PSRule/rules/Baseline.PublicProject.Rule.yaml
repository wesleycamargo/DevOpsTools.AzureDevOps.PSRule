apiVersion: github.com/microsoft/PSRule/v1
kind: Baseline
metadata:
  name: Baseline.PublicProject
spec:
  rule:
    exclude:
      - 'Azure.DevOps.Project.Visibility'
      - 'Azure.DevOps.Organization.Security.Policies.DisallowAnonymousAccess'
      - 'Azure.DevOps.Pipelines.Settings.StatusBadgesPrivate'
      - 'Azure.DevOps.Organization.Pipelines.Settings.DisableAnonymousBadgeAccess'
    tag:
      release: GA
  configuration:
    ghasEnabled: true
    ghasBlockPushesEnabled: true
    branchMinimumApproverCount: 1
    releaseMinimumProductionApproverCount: 1
