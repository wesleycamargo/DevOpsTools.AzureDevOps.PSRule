---
# Synopsis: Example module configuration for Enterprise.Rules module.
apiVersion: github.com/microsoft/PSRule/v1
kind: ModuleConfig
metadata:
  name: DevOpsTools.AzureDevOps.PSRule
spec:
  binding:
    useQualifiedName: true
    targetName:
    - ObjectName
    - name
    - displayName
    - id
    targetType:
    - ObjectType
    field:
      id: [ 'id' ]
      name: [ 'name' ]
  # convention:
  #   include:
  #   - 'AzureDevOps.Objects'
  rule:
    baseline: Baseline.Default
